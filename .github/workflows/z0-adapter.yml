name: z0 adapter

on:
  pull_request:
    paths:
      - "scripts/agentic_training_loop.py"
      - "tests/test_z0_smoke_config.py"
      - "Z0-INTEGRATION.md"
      - ".github/workflows/z0-adapter.yml"

permissions:
  contents: read

jobs:
  smoke-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_z0_smoke_config.py
